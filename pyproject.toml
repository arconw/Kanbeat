[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kanbeat"
version = "0.10.0"
description = "Filesystem-native Kanban with a persistent local AI harness supervisor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8.2", "textual-tty>=0.4,<0.5", "bittty>=0.1.4,<0.2", "websockets>=15,<18"]

[project.optional-dependencies]
terminal = ["textual-tty>=0.4"]
release = ["pyinstaller>=6.11,<7", "packaging>=23"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build>=1.2", "twine>=6"]

[project.scripts]
kanbeat = "kanbeat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kanbeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E9", "F"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kanbeat"
version = "0.2.0"
description = "Filesystem-native Kanban with a persistent local AI harness supervisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=3.0"]

[project.optional-dependencies]
terminal = ["textual-tty>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
kanbeat = "kanbeat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kanbeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

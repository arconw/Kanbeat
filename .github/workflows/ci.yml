name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: mkdir -p .tmp
      - run: python -m pytest --junitxml=.tmp/junit.xml --basetemp=.tmp/pytest -o cache_dir=.tmp/pytest-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: .tmp/junit.xml
          retention-days: 7
          include-hidden-files: true

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build --outdir .tmp/dist
      - run: python -m twine check .tmp/dist/*
      - run: |
          python -m venv .tmp/wheel-env
          .tmp/wheel-env/bin/python -m pip install .tmp/dist/*.whl
          cd .tmp
          wheel-env/bin/kanbeat --help
          wheel-env/bin/python -c "from importlib.resources import files; from kanbeat.ui.app import KanbeatApp; assert files('kanbeat.ui').joinpath('styles.tcss').is_file()"
      - run: |
          python -m venv .tmp/sdist-env
          .tmp/sdist-env/bin/python -m pip install .tmp/dist/*.tar.gz
          cd .tmp
          sdist-env/bin/kanbeat --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: .tmp/dist/*
          retention-days: 14
          include-hidden-files: true

  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          mkdir -p .tmp
          curl --fail --silent --show-error --location --output .tmp/actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --output .tmp/checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          cd .tmp
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - run: .tmp/actionlint -color

  installer:
    name: Lint the installer script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: shellcheck --shell=sh install.sh

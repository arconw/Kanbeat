name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests
      - run: python -m pytest --junitxml=.tmp/junit.xml --basetemp=.tmp/pytest -o cache_dir=.tmp/pytest-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: .tmp/junit.xml
          retention-days: 7

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build --outdir .tmp/dist
      - run: python -m twine check .tmp/dist/*
      - run: |
          python -m venv .tmp/wheel-env
          .tmp/wheel-env/bin/python -m pip install .tmp/dist/*.whl
          cd .tmp
          wheel-env/bin/kanbeat --help
          wheel-env/bin/python -c "from importlib.resources import files; from kanbeat.ui.app import KanbeatApp; assert files('kanbeat.ui').joinpath('styles.tcss').is_file()"
      - run: |
          python -m venv .tmp/sdist-env
          .tmp/sdist-env/bin/python -m pip install .tmp/dist/*.tar.gz
          cd .tmp
          sdist-env/bin/kanbeat --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: .tmp/dist/*
          retention-days: 14
